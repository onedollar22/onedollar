<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>One Dollar — Support people living with cancer</title>
<meta name="description" content="A global campaign: at least $1 each, together we support people living with cancer. Crypto donations, verifiable on-chain.">
<meta property="og:title" content="One Dollar. A million hands.">
<meta property="og:description" content="Give $1 in crypto to support people living with cancer. Every address is verifiable on-chain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎗️</text></svg>">
<style>
:root{
  --bg:#f8f5fc;--card:#fff;--ink:#1d1630;--mute:#5f5873;--line:#e0d8ee;--acc:#c2255c;--acc2:#6c3fd1;--soft:#f0e9fb;--ok:#177a4a;--bad:#b3261e;
  --fd:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Naskh Arabic","Geeza Pro",serif;
  --fb:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#130e22;--card:#1c1530;--ink:#f3eefc;--mute:#b0a6c8;--line:#34294f;--acc:#ff6b9d;--acc2:#a98bff;--soft:#241b3d;--ok:#5fd39a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#130e22;--card:#1c1530;--ink:#f3eefc;--mute:#b0a6c8;--line:#34294f;--acc:#ff6b9d;--acc2:#a98bff;--soft:#241b3d;--ok:#5fd39a;--bad:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--fb);-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px;border-radius:6px}
a{color:var(--acc2)}
.w{max-width:1040px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--fd);font-weight:700;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h2{font-size:clamp(1.8rem,4.5vw,2.7rem)}
h3{font-size:1.25rem}
p{margin:0 0 1em;max-width:60ch}
section{padding:76px 0}
.mute{color:var(--mute)}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px}
.logo{font:700 1.2rem var(--fd);text-decoration:none;color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font:500 .9rem var(--fb);cursor:pointer;text-decoration:none}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:15px 30px;font:700 1.05rem var(--fb);text-decoration:none;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.btn:hover{opacity:.88}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;padding:30px 0 50px}
.hero h1{font-size:clamp(3rem,8.5vw,6rem);margin-bottom:.25em}
.hero p{font-size:1.2rem;color:var(--mute)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
#rib{width:100%;aspect-ratio:5/6;display:block;touch-action:pan-y}
@media(max-width:800px){.hero{grid-template-columns:1fr}#rib{max-width:360px;margin:0 auto;order:-1}}

/* facts */
.facts{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.fact{border-top:3px solid var(--acc);padding-top:14px}
.fact b{font:700 1.5rem var(--fd);display:block;margin-bottom:6px}
.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font:700 1.1rem var(--fd);margin-bottom:12px}

/* wallets */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.wal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px}
.wal header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wal h3{margin:0}
.net{font-size:.82rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 9px}
.addr{direction:ltr;text-align:left;font:500 .92rem/1.55 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:11px}
.addr b{color:var(--acc);font-weight:700}
.addr.un{color:var(--bad)}
.row{display:flex;gap:8px}
.row button,.row a{flex:1;text-align:center;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:9px 6px;font:600 .92rem var(--fb);cursor:pointer;text-decoration:none}
.row .cp{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row button:disabled{opacity:.4;cursor:not-allowed}
.art{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.art .ic{font-size:1.8rem;display:block;margin-bottom:6px}.art h3{margin-bottom:.3em}
.art summary{list-style:none;cursor:pointer}.art summary::-webkit-details-marker{display:none}
.art summary b{font:700 .92rem var(--fb);color:var(--acc2)}
.art p{margin:.7em 0 0;color:var(--mute);max-width:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--acc2);border-radius:999px;padding:6px 16px;font:700 .95rem var(--fb);margin:0 0 18px}
.rb{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));margin-top:26px}
.rb figure{margin:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px 12px}
.rb svg{width:54px;height:64px;display:block;margin:0 auto 8px;transition:transform .3s}
.rb figure:hover svg{transform:translateY(-4px) rotate(-6deg)}
.rb figcaption{font:600 .9rem/1.3 var(--fb)}
.qr{display:none;justify-content:center;background:#fff;border-radius:12px;padding:12px}
.qr.on{display:flex}.qr svg{width:180px;height:180px}
.small{font-size:.86rem;color:var(--mute);margin:0}
.note{background:var(--soft);border-inline-start:5px solid var(--acc2);border-radius:10px;padding:14px 18px;margin:0 0 22px}
.note p{margin:0;max-width:none}

/* security */
.sec{background:var(--soft)}
.fp{direction:ltr;text-align:left;font:600 1.15rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;word-break:break-all;margin:14px 0}
.cols{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.cols li{margin-bottom:8px}

/* badge */
.badge{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
@media(max-width:800px){.badge{grid-template-columns:1fr}}
#bc{width:100%;max-width:380px;border-radius:18px;border:1px solid var(--line);display:block;margin:auto}
input[type=text]{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 1rem var(--fb);margin:6px 0 14px}
label{font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

details{border-bottom:1px solid var(--line);padding:16px 0}
summary{font:700 1.15rem var(--fd);cursor:pointer}
details p{margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--mute);font-size:.9rem}
.toast{position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:999px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<div class="w">
<nav>
  <a class="logo" href="#top">🎗️ <span data-t="logo"></span></a>
  <div class="tools">
    <a class="pill" href="#learn" data-t="navL"></a><a class="pill" href="#give" data-t="navG"></a>
    <button class="pill" id="lang" type="button">العربية</button>
    <button class="pill" id="theme" type="button" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<header class="hero" id="top">
  <div>
    <span class="eyebrow">🎗️ <span data-t="eye"></span></span>
    <h1 data-t="h1"></h1>
    <p data-t="sub"></p>
    <div class="cta"><a class="btn" href="#give" data-t="cta1"></a></div>
  </div>
  <canvas id="rib" role="img" aria-label="A ribbon made of many small dots, each dot one person giving one dollar"></canvas>
</header>
</div>

<section style="padding-top:10px"><div class="w">
  <div class="facts">
    <div class="fact"><b data-t="f1h"></b><p data-t="f1p"></p></div>
    <div class="fact"><b data-t="f2h"></b><p data-t="f2p"></p></div>
    <div class="fact"><b data-t="f3h"></b><p data-t="f3p"></p></div>
  </div>
</div></section>

<section id="ribbons" style="padding-top:20px"><div class="w">
  <h2 data-t="rh"></h2><p data-t="rp"></p>
  <div class="rb" id="rb"></div>
</div></section>

<section id="how" style="padding-top:20px"><div class="w">
  <h2 data-t="howh"></h2>
  <div class="steps">
    <div class="step"><h3 data-t="s1h"></h3><p class="mute" data-t="s1p"></p></div>
    <div class="step"><h3 data-t="s2h"></h3><p class="mute" data-t="s2p"></p></div>
    <div class="step"><h3 data-t="s3h"></h3><p class="mute" data-t="s3p"></p></div>
  </div>
</div></section>

<section id="give"><div class="w">
  <h2 data-t="giveh"></h2>
  <div class="note"><p data-t="fee"></p></div>
  <div class="grid" id="wallets"></div>
  <p class="small" style="margin-top:16px" data-t="verify"></p>
</div></section>


<section id="learn"><div class="w">
  <h2 data-t="lh"></h2><p data-t="lp"></p>
  <div class="grid" id="arts"></div>
  <p class="small" style="margin-top:18px" data-t="med"></p>
</div></section>

<section id="badge"><div class="w badge">
  <div>
    <h2 data-t="bh"></h2>
    <p data-t="bp"></p>
    <label for="nm" data-t="bl"></label>
    <input id="nm" type="text" maxlength="24" autocomplete="off">
    <div class="cta" style="margin-top:0"><button class="btn" id="share" type="button" data-t="bshare"></button><button class="btn alt" id="dl" type="button" data-t="bdl"></button></div>
  </div>
  <canvas id="bc" width="1080" height="1350"></canvas>
</div></section>

<section style="padding-top:0"><div class="w">
  <h2 data-t="qh"></h2>
  <details><summary data-t="q1"></summary><p data-t="a1"></p></details>
  <details><summary data-t="q2"></summary><p data-t="a2"></p></details>
  <details><summary data-t="q3"></summary><p data-t="a3"></p></details>
  <details><summary data-t="q4"></summary><p data-t="a4"></p></details>
  <details><summary data-t="q5"></summary><p data-t="a5"></p></details>
</div></section>

<footer><div class="w"><p data-t="foot"></p></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---- dots shaped like an awareness ribbon (shared by hero + badge) ---- */
const PAL=['#ff5c8a','#b388ff','#ffc23d','#2ec4b6','#ff8a3d','#5aa9ff'];
const RIB=(()=>{
  const m=document.createElement('canvas');m.width=100;m.height=120;const c=m.getContext('2d');
  c.lineWidth=15;c.lineCap='round';c.lineJoin='round';
  c.stroke(new Path2D('M50 12C20 12 20 50 50 64C80 50 80 12 50 12Z'));
  c.beginPath();c.moveTo(50,64);c.lineTo(25,112);c.moveTo(50,64);c.lineTo(75,112);c.stroke();
  const d=c.getImageData(0,0,100,120).data,pts=[];
  for(let y=0;y<120;y+=3)for(let x=0;x<100;x+=3)if(d[(y*100+x)*4+3]>140)pts.push({x:x/100,y:y/120,c:PAL[(Math.floor(x/3)+Math.floor(y/3)*2)%PAL.length]});
  return pts;
})();
function drawRib(ctx,x0,y0,W,H,r,prog,mx,my){
  const s=Math.min(W/100,H/120),ox=x0+(W-100*s)/2,oy=y0+(H-120*s)/2;
  for(const p of RIB){
    const k=Math.min(1,Math.max(0,prog*2.2-p.y*1.2)); if(k<=0)continue;
    let x=ox+p.x*100*s,y=oy+p.y*120*s;
    if(mx!=null){const dx=x-mx,dy=y-my,d=Math.hypot(dx,dy),R=W*.18;if(d<R){const f=(1-d/R)*s*7;x+=dx/d*f;y+=dy/d*f}}
    ctx.globalAlpha=k;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(x,y,r*s*k,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
}
(function hero(){
  const cv=$('#rib'),ctx=cv.getContext('2d');let W,H,mx=null,my=null,t0=performance.now();
  const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function size(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  function frame(now){
    const p=rm?1:Math.min(1,(now-t0)/2400);ctx.clearRect(0,0,W,H);
    const br=1+(rm?0:Math.sin(now/900)*.06);
    drawRib(ctx,0,0,W,H,1.05*br,1-Math.pow(1-p,3),mx,my);requestAnimationFrame(frame);
  }
  addEventListener('resize',size);size();
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
  cv.addEventListener('pointerleave',()=>{mx=my=null});
  requestAnimationFrame(frame);
})();

/* ---- wallets ---- */
const strong=a=>a.length>14?`<b>${a.slice(0,6)}</b>${a.slice(6,-6)}<b>${a.slice(-6)}</b>`:a;
function buildWallets(){
  const g=$('#wallets');g.innerHTML='';
  CONFIG.wallets.forEach(w=>{
    const u=unset(w.addr),el=document.createElement('article');el.className='wal';
    el.innerHTML=`<header><h3>${w.name}</h3><span class="net">${w.net}</span></header>
    <div class="addr ${u?'un':''}">${u?t('unset'):strong(w.addr)}</div><div class="qr"></div>
    <div class="row"><button class="cp" ${u?'disabled':''}>${t('copy')}</button><button class="q" ${u?'disabled':''}>${t('qr')}</button>${u?'':`<a href="${w.ex}${encodeURIComponent(w.addr)}" target="_blank" rel="noopener noreferrer">${t('ex')}</a>`}</div>
    <p class="small">${t('net').replace('{sym}',w.sym).replace('{net}',w.net)}</p>`;
    el.querySelector('.cp').onclick=async()=>{try{await navigator.clipboard.writeText(w.addr);toast(t('copied'))}catch(e){toast(t('manual'))}};
    el.querySelector('.q').onclick=()=>{const q=el.querySelector('.qr');if(!q.innerHTML){const o=qrcode(0,'M');o.addData(w.uri+w.addr);o.make();q.innerHTML=o.createSvgTag({cellSize:5,margin:0,scalable:true})}q.classList.toggle('on')};
    g.appendChild(el);
  });
}

const ART=[{"i": "🔎", "t": {"en": "Early detection can change the outcome", "ar": "الكشف المبكر قد يغيّر النتيجة"}, "p": {"en": ["Many cancers are easier to treat when they are found early. Screening tests exist for several types, including breast, cervical and colorectal cancer, and for some high-risk groups, lung cancer. Recommended ages and schedules differ between countries, so ask your doctor what applies to you.", "Know what is normal for your body. See a doctor if you notice a lump that does not go away, unexplained weight loss, a cough or hoarseness that lasts for weeks, blood in stool or urine, unusual bleeding, or a sore that does not heal. Most of these have other causes, but they deserve to be checked."], "ar": ["كثير من السرطانات يسهل علاجها حين تُكتشف مبكرًا. توجد فحوص كشف لعدة أنواع منها سرطان الثدي وعنق الرحم والقولون، ولبعض الفئات الأعلى خطرًا سرطان الرئة. تختلف الأعمار والمواعيد الموصى بها من بلد لآخر، فاسأل طبيبك عمّا يناسبك.", "اعرف ما هو طبيعي في جسمك. راجع الطبيب إذا لاحظت كتلة لا تزول، أو نزول وزن بلا سبب، أو سعالًا أو بحّة تستمر أسابيع، أو دمًا في البراز أو البول، أو نزيفًا غير معتاد، أو جرحًا لا يلتئم. أغلبها له أسباب أخرى، لكنها تستحق الفحص."]}}, {"i": "🤝", "t": {"en": "How to support someone with cancer", "ar": "كيف تدعم شخصًا مصابًا بالسرطان"}, "p": {"en": ["Listen more than you advise. Many people with cancer say that being heard matters more than being given solutions. Avoid unsolicited medical tips and pressure to stay positive; it is fine to sit with difficult feelings.", "Offer specific help instead of a general “let me know”: cooking a meal, driving to an appointment, looking after children, handling a task. And keep showing up. Support is often most scarce after the first weeks."], "ar": ["استمع أكثر مما تنصح. كثيرون ممن مروا بالسرطان يقولون إن الإصغاء إليهم أهم من تقديم الحلول. تجنّب النصائح الطبية غير المطلوبة والضغط عليهم بالتفاؤل، فلا بأس بالجلوس مع المشاعر الصعبة.", "اعرض مساعدة محددة بدل عبارة عامة مثل «أخبرني إن احتجت»: وجبة، أو توصيلة إلى موعد، أو رعاية الأطفال، أو إنجاز مهمة. واستمر في الحضور، فالدعم يقلّ غالبًا بعد الأسابيع الأولى."]}}, {"i": "💸", "t": {"en": "The costs people do not see", "ar": "التكاليف التي لا يراها الناس"}, "p": {"en": ["Treatment is more than medicine. Families often face travel to distant hospitals, time off work, extra care at home, special food and the cost of simply getting through each week. Researchers call this the financial burden of cancer, and it affects people in many countries, including those with insurance.", "This is why small, practical help matters. A gift does not need to be large to be part of something bigger when many people give together."], "ar": ["العلاج ليس دواءً فقط. فالعائلات تواجه غالبًا السفر إلى مستشفيات بعيدة، والغياب عن العمل، والرعاية الإضافية في البيت، والغذاء الخاص، وتكلفة تجاوز كل أسبوع. يسمّي الباحثون هذا العبء المالي للسرطان، وهو يمس الناس في بلدان كثيرة حتى من لديهم تأمين.", "لهذا يهمّ الدعم الصغير العملي. لا يلزم أن يكون التبرع كبيرًا ليصير جزءًا من شيء أكبر حين يجتمع كثيرون."]}}, {"i": "✅", "t": {"en": "Myths and facts", "ar": "خرافات وحقائق"}, "p": {"en": ["Myth: cancer is contagious. Fact: you cannot catch cancer from someone. Myth: cancer only affects older people. Fact: it can occur at any age, although risk rises with age.", "Myth: a special diet or supplement can cure cancer. Fact: no diet replaces medical treatment, and a balanced diet is best seen as support during care. Myth: a diagnosis is always a death sentence. Fact: survival has improved for many cancers thanks to earlier detection and better treatment."], "ar": ["خرافة: السرطان معدٍ. الحقيقة: لا يمكنك أن تصاب بالسرطان من شخص آخر. خرافة: السرطان يصيب كبار السن فقط. الحقيقة: قد يحدث في أي عمر، وإن كان الخطر يزداد مع التقدم في السن.", "خرافة: نظام غذائي أو مكمّل معيّن يشفي السرطان. الحقيقة: لا يغني أي نظام غذائي عن العلاج الطبي، والغذاء المتوازن عون أثناء العلاج. خرافة: التشخيص حكم بالموت دائمًا. الحقيقة: تحسّنت نسب البقاء على قيد الحياة في كثير من السرطانات بفضل الكشف المبكر وتطوّر العلاج."]}}, {"i": "🛡️", "t": {"en": "Lowering your risk", "ar": "كيف تقلّل خطر الإصابة"}, "p": {"en": ["No one can remove risk completely, but some habits help: do not smoke, limit alcohol, stay physically active, keep a healthy weight, and protect your skin from strong sun.", "Vaccines also play a role. The HPV vaccine helps prevent cervical and some other cancers, and the hepatitis B vaccine reduces the risk of liver cancer. Ask your doctor or local health service which are available to you."], "ar": ["لا أحد يستطيع إزالة الخطر كليًا، لكن بعض العادات تساعد: لا تدخّن، وقلّل الكحول، وحافظ على نشاطك البدني ووزن صحي، واحمِ بشرتك من الشمس القوية.", "وللّقاحات دور أيضًا. يساعد لقاح فيروس الورم الحليمي (HPV) في الوقاية من سرطان عنق الرحم وبعض السرطانات الأخرى، ويقلل لقاح التهاب الكبد B خطر سرطان الكبد. اسأل طبيبك أو الجهة الصحية المحلية عمّا هو متاح لك."]}}];
function buildArts(){
  const g=$('#arts');g.innerHTML='';
  ART.forEach(a=>{
    const d=document.createElement('details');d.className='art';
    const sm=document.createElement('summary'),ic=document.createElement('span'),h=document.createElement('h3'),b=document.createElement('b');
    ic.className='ic';ic.textContent=a.i;h.textContent=a.t[L];b.textContent=t('more')+' →';sm.append(ic,h,b);d.appendChild(sm);
    a.p[L].forEach(x=>{const p=document.createElement('p');p.textContent=x;d.appendChild(p)});g.appendChild(d);
  });

const RIBS=[["#f06ca5","Breast","الثدي"],["#f2b705","Childhood cancers","سرطان الأطفال"],["#6bb7f2","Prostate","البروستات"],["#f28c28","Leukaemia","سرطان الدم"],["#2bb5a6","Ovarian","المبيض"],["#2f4fa8","Colorectal","القولون والمستقيم"],["#c9c3d6","Lung","الرئة"],["#8fc93a","Lymphoma","الغدد اللمفاوية"],["#a58cf0","All cancers","كل السرطانات"]];
function buildRibbons(){
  const g=$('#rb');g.innerHTML='';

/* ---- badge ---- */
function badge(){
  const cv=$('#bc'),c=cv.getContext('2d'),dark=matchMedia('(prefers-color-scheme:dark)').matches&&root.dataset.theme!=='light'||root.dataset.theme==='dark';
  const g=c.createLinearGradient(0,0,0,1350);g.addColorStop(0,'#1d1630');g.addColorStop(1,'#3a1d4f');c.fillStyle=g;c.fillRect(0,0,1080,1350);
  drawRib(c,140,90,800,760,1.1,1,null,null);
  c.fillStyle='#fff';c.textAlign='center';const nm=$('#nm').value.trim();
  c.font='700 150px Georgia,serif';c.fillText('$1',540,1030);
  c.font='600 52px Georgia,serif';c.fillText((nm?nm+' ':'')+t('bname'),540,1110);
  c.font='400 38px system-ui,sans-serif';c.fillStyle='#d9cdf3';c.fillText(t('bcap'),540,1190);
  c.font='500 30px system-ui,sans-serif';c.fillText(location.host||'',540,1260);
}
const blob=()=>new Promise(r=>$('#bc').toBlob(r,'image/png'));
$('#nm').addEventListener('input',badge);
$('#dl').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(await blob());a.download='one-dollar-badge.png';a.click()};
$('#share').onclick=async()=>{
  const b=await blob(),f=new File([b],'badge.png',{type:'image/png'}),d={text:t('sharetxt'),url:location.href.split('#')[0],files:[f]};
  try{ if(navigator.canShare&&navigator.canShare(d)) await navigator.share(d); else $('#dl').click(); }catch(e){}
};

/* ---- language / theme ---- */
function apply(){
  root.lang=L;root.dir=L==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));
  $('#lang').textContent=L==='ar'?'English':'العربية';
  document.querySelector('footer p').textContent=t('foot');
  document.title=L==='ar'?'دولار واحد — ادعم مرضى السرطان':'One Dollar — Support people living with cancer';
  $('#nm').placeholder=L==='ar'?'مثال: سارة':'e.g. Sara';
  buildWallets();buildRibbons();buildArts();badge();
}
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('l',L)}catch(e){}apply()};
$('#theme').onclick=()=>{const d=matchMedia('(prefers-color-scheme:dark)').matches;const cur=root.dataset.theme||(d?'dark':'light');root.dataset.theme=cur==='dark'?'light':'dark'};
apply();
